name: 发布 GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      full: true

  release-notes:
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
